# Render blueprint — one-click web service + Postgres.
# Dashboard → New → Blueprint → point at this repo. Set the sync:false secrets.
services:
  - type: web
    name: quorum
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node scripts/migrate.mjs && node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5001"
      - key: DATABASE_URL
        fromDatabase:
          name: quorum-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEFAULT_AUX_MODEL
        value: poolside/laguna-s-2.1:free
      - key: ALLOWED_ORIGIN
        sync: false

databases:
  - name: quorum-db
    plan: basic-256mb
    databaseName: quorum
    user: quorum
